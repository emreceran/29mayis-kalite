<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İstanbul 29 Mayıs Üniversitesi Kalite Göstergeleri Panosu</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#1c355e; --mid:#4bb5e8; --gold:#c8a84b; --border:#dce3ef; --muted:#5a6a80; --text:#334155; --light:#f8fafc; --shadow:0 1px 3px rgba(0,0,0,.05); }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Roboto Slab',serif; color:var(--text); background:#f1f5f9; }
  a{ text-decoration:none; }
  /* Header */
  .dash-header{ background:var(--navy); color:#fff; }
  .dash-header .wrap{ max-width:1400px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px; }
  .dash-header img{ height:44px;background:#fff;border-radius:8px;padding:4px; }
  .dash-header h1{ font-size:16px;font-weight:700;margin:0;line-height:1.25; }
  .dash-header .sub{ font-size:11.5px;color:#a9c2e3;letter-spacing:.08em;text-transform:uppercase; }
  .back-link{ margin-left:auto;color:#cfe0f5;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);padding:8px 15px;border-radius:8px;transition:background .2s; }
  .back-link:hover{ background:rgba(255,255,255,.2); }
  /* Layout */
  .dash-layout{ max-width:1400px;margin:0 auto;display:grid;grid-template-columns:250px 1fr;gap:24px;padding:24px 22px; }
  /* Sidebar */
  .dash-nav{ position:sticky;top:20px;align-self:start;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow);max-height:calc(100vh - 40px);overflow-y:auto; }
  .nav-group-lbl{ font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;padding:12px 12px 6px; }
  .nav-item{ display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;margin-bottom:2px; }
  .nav-item i{ width:18px;text-align:center;font-size:14px;color:#94a3b8;transition:color .15s; }
  .nav-item:hover{ background:var(--light);color:var(--navy); }
  .nav-item.active{ background:var(--navy);color:#fff; }
  .nav-item.active i{ color:#cfe0f5; }
  /* Content */
  .dash-main{ min-width:0; }
  .page-title{ font-size:22px;font-weight:800;color:var(--navy);margin:0 0 4px; }
  .page-desc{ font-size:13.5px;color:var(--muted);margin:0 0 22px; }
  /* KPI */
  .kpi-grid{ display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px; }
  .kpi{ background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);border-left:4px solid var(--kc,#1c355e); }
  .kpi-val{ font-size:26px;font-weight:800;color:var(--navy);line-height:1; }
  .kpi-lbl{ font-size:12.5px;color:var(--text);font-weight:600;margin-top:6px; }
  .kpi-sub{ font-size:11px;color:#94a3b8;margin-top:3px; }
  /* Toggle chart card */
  .tc-card{ background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px; }
  .tc-head{ display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:12px; }
  .tc-head h4{ margin:0;font-size:15px;font-weight:700;color:var(--navy);display:flex;align-items:center; }
  .tc-sub{ font-size:11.5px;color:#94a3b8; }
  .tc-toggles{ display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px; }
  .tpill{ display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);color:#94a3b8;font-family:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:6px;cursor:pointer;transition:all .15s;line-height:1.1; }
  .tpill .tdot{ width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.45;flex-shrink:0; }
  .tpill:hover{ border-color:var(--pc); }
  .tpill.on{ color:#fff;background:var(--pc);border-color:var(--pc); }
  .tpill.on .tdot{ background:#fff;opacity:1; }
  .tpill:not(.on){ text-decoration:line-through;text-decoration-color:#cbd5e1; }
  .chart-wrap{ position:relative;width:100%; }
  .tc-grid{ display:grid;grid-template-columns:1fr 1fr;gap:18px; }
  .src-note{ font-size:11.5px;color:#94a3b8;margin-top:6px;text-align:right; }
  .info-box{ background:#f4f6f9;border:1px solid #e0e6ec;border-left:4px solid var(--navy);border-radius:8px;padding:12px 16px;font-size:13px;color:#42505f;margin-bottom:18px; }
  /* Fakülte/Birim panosu */
  .chart-card{ background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow); }
  .chart-card h4{ font-size:14px;font-weight:700;color:var(--navy);margin:0 0 2px;display:flex;align-items:center;gap:8px; }
  .chart-card .sub{ font-size:11px;color:#94a3b8;margin-bottom:12px; }
  .dash-select{ appearance:none;background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;font-family:inherit;transition:border-color .2s; }
  .dash-select:focus{ outline:none;border-color:var(--mid);box-shadow:0 0 0 3px rgba(75,181,232,.15); }
  .dash-select:disabled{ opacity:.5;cursor:not-allowed; }
  .dash-table{ width:100%;border-collapse:collapse;font-size:13px; }
  .dash-table thead th{ background:var(--navy);color:#fff;padding:9px 12px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px; }
  .dash-table thead th:not(:first-child){ text-align:right; }
  .dash-table tbody td{ padding:9px 12px;border-bottom:1px solid var(--border); }
  .dash-table tbody td:not(:first-child){ text-align:right;font-variant-numeric:tabular-nums; }
  .dash-table tbody td:first-child{ font-weight:600;color:var(--navy); }
  .dash-table tbody tr:hover{ background:var(--light); }
  .dash-bar{ display:inline-block;height:7px;border-radius:4px;background:var(--mid);vertical-align:middle;margin-left:8px; }
  /* Mobile */
  .nav-toggle{ display:none; }
  @media (max-width:900px){
    .dash-layout{ grid-template-columns:1fr; }
    .dash-nav{ position:static;max-height:none; }
    .tc-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header class="dash-header">
  <div class="wrap">
    <img src="../logo.png" alt="Logo">

      <div class="sub">Kalite Göstergeleri Panosu</div>

    <a class="back-link" href="../index.html"><i class="fas fa-arrow-left"></i> Kalite Sitesi</a>

</header>

<div class="dash-layout">

  <main class="dash-main" id="dash-content"></main>

<script src="yokak-data.js"></script>
<script src="yayin-data.js"></script>
<script>

    { label:'Fiziki Alan (m²)',    color:'#4bb5e8', on:false, axis:'y',  data:[800,833,6243,6567,6567,6567,6567,6567,10560] },
    { label:'Öğrenci Başına Kitap',color:'#059669', on:false, axis:'y1', data:[39.25,41.43,46.03,44.43,42.65,35.63,29.49,28.32,26.56] },
    { label:'Veri Tabanı Üyeliği', color:'#e11d48', on:false, axis:'y1', data:[2,1,1,2,4,4,4,3,3] },

    { label:'Mezun', color:'#1c355e', on:true, data:[108,188,294,242,250,250,258,544,567] },

/* ── Toggle grafik bileşeni ── */
const TC = {};
function tcCard(g){
  const pills = g.series.map((s,i)=>
    `<button class="tpill ${s.on?'on':''}" style="--pc:${s.color}" onclick="tcToggle('${g.id}',${i},this)"><span class="tdot"></span>${s.label}</button>`
  ).join('');
  return `<div class="tc-card">
    <div class="tc-head"><h4>${g.title}</h4><span class="tc-sub">${g.sub||''}</span></div>
    <div class="tc-toggles">${pills}</div>
    <div class="chart-wrap" style="height:300px"><canvas id="tc-${g.id}"></canvas></div>
  </div>`;
}
function tcBuild(g){
  const el=document.getElementById('tc-'+g.id); if(!el||typeof Chart==='undefined') return;
  const gridColor='rgba(0,0,0,.05)', bar=(g.type==='bar'), stacked=!!g.stacked;
  const usesRight=g.series.some(s=>s.axis==='y1');
  const datasets=g.series.map(s=>({
    label:s.label,data:s.data,hidden:!s.on,borderColor:s.color,
    backgroundColor: bar? s.color : s.color+'22', yAxisID:s.axis||'y',
    tension:.35,borderWidth:2.2,pointRadius:2.4,pointHoverRadius:4,pointBackgroundColor:s.color,fill:false,maxBarThickness:30,borderRadius:5 }));
  if(TC[g.id]){ try{TC[g.id].destroy();}catch(e){} }
  TC[g.id]=new Chart(el,{ type:g.type||'line', data:{labels:g.labels,datasets},
    options:{ responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>` ${c.dataset.label}: ${Number(c.parsed.y).toLocaleString('tr-TR')}`}}},
      scales:{ x:{grid:{display:false},stacked},
        y:{position:'left',beginAtZero:true,stacked,grid:{color:gridColor},ticks:{callback:(v)=>Number(v).toLocaleString('tr-TR')}},
        y1:{display:usesRight?'auto':false,position:'right',beginAtZero:true,grid:{drawOnChartArea:false}} } } });
}
function tcToggle(gid,idx,btn){ const ch=TC[gid]; if(!ch) return; const ds=ch.data.datasets[idx]; ds.hidden=!ds.hidden; ch.update(); if(btn) btn.classList.toggle('on',!ds.hidden); }

/* ── YÖKAK bölümlerini "group" yapısına çevir ── */
function yokakGroups(sec){
  return sec.cards.map((c,ci)=>({
    id:`y-${sec.id}-${ci}`, title:c.title, sub:`${YOKAK.years[0]}-${YOKAK.years[YOKAK.years.length-1]}`,
    icon:sec.icon, accent:'#1c355e', type:c.type||'line', labels:YOKAK.years, series:c.series
  }));
}

/* ── Navigasyon (fonksiyona göre) ── */
const NAV = [
  { grp:'Genel', items:[ {id:'genel', icon:'fa-gauge-high', text:'Genel Bakış'} ] },
  { grp:'Sayılarla Üniversitemiz', items:[
    {id:'s-ogrenci',   icon:'fa-user-graduate',   text:'Öğrenci Sayıları'},
    {id:'s-akademik',  icon:'fa-building-columns', text:'Akademik Birim & Program'},
    {id:'s-personel',  icon:'fa-users',            text:'Personel'},
    {id:'s-kutuphane', icon:'fa-book',             text:'Kütüphane'},
    {id:'s-mezun',     icon:'fa-user-check',       text:'Mezunlar'},
    {id:'fakulte-birim', icon:'fa-sitemap',        text:'Fakülte / Birim Bazlı'},
  ]},
  { grp:'Akademik Yayınlar', items:[
    {id:'yayinlar', icon:'fa-book-open', text:'Yayın İstatistikleri'},
  ]},
  { grp:'YÖKAK Performans Göstergeleri', items:[
    {id:'yokak-kuruma-ait', icon:'fa-building-columns', text:'Kuruma Ait Bilgiler'},
    {id:'yokak-kalite-guvence', icon:'fa-shield-halved', text:'Kalite Güvence Sistemi'},
    {id:'yokak-egitim-ogretim', icon:'fa-graduation-cap', text:'Eğitim-Öğretim'},
    {id:'yokak-arastirma', icon:'fa-flask', text:'Araştırma-Geliştirme'},
    {id:'yokak-toplumsal', icon:'fa-hands-helping', text:'Toplumsal Katkı'},
  ]},
];

/* Sayılarla alt bölümleri → hangi grafikleri gösterir */
const SAY_SECTIONS = {
  's-ogrenci':   {title:'Öğrenci Sayıları', icon:'fa-user-graduate', ids:['ogrenci']},
  's-akademik':  {title:'Akademik Birimler ve Programlar', icon:'fa-building-columns', ids:['birim','program']},
  's-personel':  {title:'Akademik ve İdari Personel', icon:'fa-users', ids:['personel']},
  's-kutuphane': {title:'Kütüphane', icon:'fa-book', ids:['kutuphane']},
  's-mezun':     {title:'Mezunlar', icon:'fa-user-check', ids:['mezun']},
};

function renderNav(active){
  document.getElementById('dash-nav').innerHTML = NAV.map(g=>`
    <div class="nav-group-lbl">${g.grp}</div>
    ${g.items.map(it=>`<div class="nav-item ${it.id===active?'active':''}" onclick="go('${it.id}')"><i class="fas ${it.icon}"></i>${it.text}</div>`).join('')}
  `).join('');
}

function go(id){
  if(location.hash!=='#'+id){ try{ history.replaceState(null,'','#'+id); }catch(e){} }
  renderNav(id);
  const c=document.getElementById('dash-content');
  let groups=[], title='', desc='', icon='fa-chart-line', pre='';
  if(id==='genel'){ return renderGenel(); }
  if(id==='fakulte-birim'){ return renderFakulteBirim(); }
  if(id==='yayinlar'){ return renderYayinlar(); }
  if(SAY_SECTIONS[id]){
    const s=SAY_SECTIONS[id]; title=s.title; icon=s.icon;
    desc='İstanbul 29 Mayıs Üniversitesi’ne ait yıllara göre kurumsal veriler. Her grafikte istatistikleri etiketlere tıklayarak açıp kapatabilirsiniz.';
    groups=SAYILARLA.filter(g=>s.ids.includes(g.id));
    pre=`<div class="src-note">Kaynak: Sayılarla İstanbul 29 Mayıs Üniversitesi</div>`;
  } else {
    const sid=id.replace('yokak-','');
    const sec=YOKAK.sections.find(s=>s.id===sid);
    title=sec.title; icon=sec.icon;
    desc='YÖKAK performans göstergeleri (2018-2024). Grafiklerde göstergeleri etiketlere tıklayarak açıp kapatabilirsiniz.';
    groups=yokakGroups(sec);
    pre=`<div class="src-note">Kaynak: YÖKAK Performans Göstergeleri (mis.yokak.gov.tr)</div>`;
  }
  c.innerHTML = `<h2 class="page-title">${title}</h2><p class="page-desc">${desc}</p>${groups.map(tcCard).join('')}${pre}`;
  groups.forEach(tcBuild);
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderGenel(){
  const c=document.getElementById('dash-content');
  const kpis=[
    {c:'#1c355e',val:'5.545',lbl:'Toplam Öğrenci',sub:'2025'},
    {c:'#4bb5e8',val:'179',lbl:'Akademik Personel',sub:'2025'},
    {c:'#7c3aed',val:'40',lbl:'Program Sayısı',sub:'Lisans+Lisansüstü+Ön Lisans'},
    {c:'#059669',val:'1.244',lbl:'İşe Yerleşmiş Mezun',sub:'2024 (kümülatif)'},
    {c:'#c8a84b',val:'148.745',lbl:'Kütüphane Kitap',sub:'2025'},
    {c:'#e11d48',val:'340',lbl:'Uluslararası Öğrenci',sub:'YÖKAK 2024'},
  ];
  const feat=[SAYILARLA[0], yokakGroups(YOKAK.sections.find(s=>s.id==='egitim-ogretim'))[3]];
  c.innerHTML = `
    <h2 class="page-title">Genel Bakış</h2>
    <p class="page-desc">İstanbul 29 Mayıs Üniversitesi kalite ve performans göstergeleri panosu. Soldaki menüden fonksiyona göre bölümleri inceleyebilirsiniz.</p>
    <div class="kpi-grid">${kpis.map(k=>`<div class="kpi" style="--kc:${k.c}"><div class="kpi-val">${k.val}</div><div class="kpi-lbl">${k.lbl}</div><div class="kpi-sub">${k.sub}</div></div>`).join('')}</div>
    <div class="info-box">Bu pano iki veri kümesi sunar: <strong>Sayılarla Üniversitemiz</strong> (kurumsal yıllık veriler) ve <strong>YÖKAK Performans Göstergeleri</strong> (2018-2024). Grafiklerdeki istatistikler etiketlere tıklanarak açılıp kapatılabilir.</div>
    ${feat.map(tcCard).join('')}`;
  feat.forEach(tcBuild);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── Akademik Yayın İstatistikleri (YÖK Akademik envanteri) ── */
let YCH = {};
function renderYayinlar(){
  const c=document.getElementById('dash-content'); const Y=YAYIN;
  const kpis=[
    {c:'#1c355e',val:Y.toplam.toLocaleString('tr-TR'),lbl:'Toplam Yayın',sub:'2000-2025'},
    {c:'#4bb5e8',val:Y.nhoca,lbl:'Öğretim Üyesi',sub:'6 fakülte'},
    {c:'#7c3aed',val:Y.nfak,lbl:'Fakülte',sub:''},
    {c:'#c8a84b',val:Y.enYil,lbl:'En Üretken Yıl',sub:Y.enYilN+' yayın'},
  ];
  const card=(id,title,icon,h)=>`<div class="tc-card"><div class="tc-head"><h4>${title}</h4></div><div class="chart-wrap" style="height:${h||320}px"><canvas id="${id}"></canvas></div></div>`;
  c.innerHTML=`
    <h2 class="page-title">Akademik Yayın İstatistikleri</h2>
    <p class="page-desc">Üniversitemizdeki öğretim üyelerinin makale, bildiri, kitap ve kitap bölümü yayınlarının YÖK Akademik'ten derlenmiş envanteri.</p>
    <div class="kpi-grid">${kpis.map(k=>`<div class="kpi" style="--kc:${k.c}"><div class="kpi-val">${k.val}</div><div class="kpi-lbl">${k.lbl}</div><div class="kpi-sub">${k.sub}</div></div>`).join('')}</div>

function normalizeDash(){ DASH.faculties.forEach(f=>{ const u=f.unvan||{}; f.ogrenci=(f.kadin||0)+(f.erkek||0); f.akademik=(u.prof||0)+(u.docent||0)+(u.drOgr||0)+(u.ogrGor||0)+(u.arasGor||0); }); }

const UNVAN_LABELS={prof:'Profesör',docent:'Doçent',drOgr:'Dr. Öğr. Üyesi',ogrGor:'Öğr. Görevlisi',arasGor:'Araştırma Görevlisi'};
const UNVAN_RENK={prof:'#1c355e',docent:'#2d5986',drOgr:'#4bb5e8',ogrGor:'#c8a84b',arasGor:'#94a3b8'};
function nf(n){ return n.toLocaleString('tr-TR'); }
function dashTotals(list){ const t={ogrenci:0,kadin:0,erkek:0,akademik:0,uluslararasi:0,bolum:0,unvan:{prof:0,docent:0,drOgr:0,ogrGor:0,arasGor:0}};
  list.forEach(f=>{ t.ogrenci+=f.ogrenci;t.kadin+=f.kadin;t.erkek+=f.erkek;t.akademik+=f.akademik;t.uluslararasi+=f.uluslararasi;t.bolum+=f.bolumler.length; for(const k in t.unvan) t.unvan[k]+=f.unvan[k]; }); return t; }
let DASH_CHARTS=[];
function dashDestroy(){ DASH_CHARTS.forEach(c=>{try{c.destroy();}catch(e){}}); DASH_CHARTS=[]; }
function dashRender(){
  const fSel=document.getElementById('dash-fac'), bSel=document.getElementById('dash-bol');
  if(!fSel) return;
  const fac=DASH.faculties.find(f=>f.id===fSel.value);
  if(fac){ bSel.disabled=false; bSel.innerHTML='<option value="">Tüm Bölümler</option>'+fac.bolumler.map((b,i)=>`<option value="${i}">${b.ad}</option>`).join(''); }
  else { bSel.disabled=true; bSel.innerHTML='<option value="">Tüm Bölümler</option>'; }
  dashUpdate();
}
function dashUpdate(){
  dashDestroy();
  const fSel=document.getElementById('dash-fac'), bSel=document.getElementById('dash-bol');
  const fac=DASH.faculties.find(f=>f.id===fSel.value);
  const bolIdx=bSel.value===''?-1:parseInt(bSel.value,10);
  const scope=fac?[fac]:DASH.faculties; const t=dashTotals(scope);
  let ogrenciVal=t.ogrenci,bolumVal=t.bolum,akademikVal=t.akademik,kapsamEtiket=fac?fac.ad:'Tüm Üniversite';
  if(fac&&bolIdx>=0){ const b=fac.bolumler[bolIdx]; ogrenciVal=b.ogrenci;bolumVal=1;akademikVal=b.akademik;kapsamEtiket=fac.kisa+' / '+b.ad; }
  const kadinOran=t.ogrenci?Math.round(t.kadin/t.ogrenci*100):0;
  const oranOA=akademikVal?(ogrenciVal/akademikVal).toFixed(1):'0';
  const kpis=[
    {c:'#1c355e',val:nf(ogrenciVal),lbl:'Öğrenci',sub:kapsamEtiket},
    {c:'#4bb5e8',val:nf(akademikVal),lbl:'Akademik Personel',sub:DASH.donem},
    {c:'#7c3aed',val:nf(bolumVal),lbl:(fac&&bolIdx>=0)?'Program':'Bölüm / Program',sub:fac?fac.kisa:(DASH.faculties.length+' Akademik Birim')},

    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:14}}}} }));
  const uKeys=['prof','docent','drOgr','ogrGor','arasGor'];
  DASH_CHARTS.push(new Chart(document.getElementById('ch-unvan'),{ type:'bar',
    data:{labels:uKeys.map(k=>UNVAN_LABELS[k]),datasets:[{data:uKeys.map(k=>t.unvan[k]),backgroundColor:uKeys.map(k=>UNVAN_RENK[k]),borderRadius:5,maxBarThickness:24}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:gridColor},beginAtZero:true},y:{grid:{display:false}}}} }));
  DASH_CHARTS.push(new Chart(document.getElementById('ch-trend'),{ type:'line',
    data:{labels:DASH.trend.labels,datasets:[
      {label:'Öğrenci',data:DASH.trend.ogrenci,borderColor:'#1c355e',backgroundColor:'rgba(28,53,94,.08)',fill:true,tension:.35,borderWidth:2.5,pointRadius:3,yAxisID:'y'},
      {label:'Uluslararası Öğrenci',data:DASH.trend.uluslararasi,borderColor:'#c8a84b',backgroundColor:'rgba(200,168,75,.10)',fill:true,tension:.35,borderWidth:2,pointRadius:3,yAxisID:'y1'},
      {label:'Akademik Personel',data:DASH.trend.akademik,borderColor:'#4bb5e8',backgroundColor:'transparent',tension:.35,borderWidth:2,pointRadius:3,yAxisID:'y1'} ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:14,usePointStyle:true}}},
      scales:{x:{grid:{display:false}},y:{position:'left',grid:{color:gridColor},beginAtZero:true,title:{display:true,text:'Öğrenci'}},y1:{position:'right',grid:{display:false},beginAtZero:true,title:{display:true,text:'Personel / Ulus.'}}}} }));
  const rows=fac?fac.bolumler.map(b=>({ad:b.ad,ogrenci:b.ogrenci,akademik:b.akademik})):DASH.faculties.map(f=>({ad:f.ad,ogrenci:f.ogrenci,akademik:f.akademik}));
  const maxO=Math.max.apply(null,rows.map(r=>r.ogrenci));
  document.getElementById('dash-tbody').innerHTML=rows.map(r=>`<tr><td>${r.ad}</td><td>${nf(r.ogrenci)}<span class="dash-bar" style="width:${Math.max(6,Math.round(r.ogrenci/maxO*70))}px"></span></td><td>${nf(r.akademik)}</td><td>${r.akademik?(r.ogrenci/r.akademik).toFixed(1):'—'}</td></tr>`).join('')+
    `<tr style="background:#f4f6fb;font-weight:700"><td style="font-weight:800">${fac?fac.kisa+' Toplam':'GENEL TOPLAM'}</td><td>${nf(rows.reduce((s,r)=>s+r.ogrenci,0))}</td><td>${nf(rows.reduce((s,r)=>s+r.akademik,0))}</td><td>${(rows.reduce((s,r)=>s+r.ogrenci,0)/Math.max(1,rows.reduce((s,r)=>s+r.akademik,0))).toFixed(1)}</td></tr>`;
}

/* init — önce panelden üretilen veriyi çek (yoksa gömülü veriyle çalışır) */
function _boot(){
  const _allIds = NAV.flatMap(g=>g.items.map(i=>i.id));
  const _h = location.hash.replace('#','');
  go(_allIds.includes(_h) ? _h : 'genel');
}
(async ()=>{
  try{
    const r = await fetch('../data/dashboard.json',{cache:'no-store'});
    if(r.ok){
      const d = await r.json();
      if(Array.isArray(d.groups) && d.groups.length) SAYILARLA = d.groups;
      if(d.yokak && Array.isArray(d.yokak.sections)){ YOKAK.years = d.yokak.years; YOKAK.sections = d.yokak.sections; }
      if(d.dash && Array.isArray(d.dash.faculties) && d.dash.faculties.length){ DASH = d.dash; normalizeDash(); }
    }
  }catch(e){ console.warn('dashboard.json yüklenemedi, gömülü veri kullanılıyor:', e.message); }
  _boot();
})();
